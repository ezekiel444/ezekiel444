<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASCII Portrait Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: #0D1117;
      font-family: system-ui, sans-serif;
      padding: 2rem;
      gap: 2rem;
    }
    h1 {
      color: #E8DCC8;
      font-weight: 300;
      font-size: 1.4rem;
    }
    .label {
      color: #5B7D99;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    .card {
      background: #161B22;
      border: 1px solid #2C4A5E;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    img {
      border-radius: 8px;
      max-width: 100%;
    }
    .note {
      color: #4A6B8A;
      font-size: 0.75rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>ASCII Portrait — Animation Preview</h1>

  <div class="card">
    <div class="label">Profile Card (portrait + info panel combined)</div>
    <img src="./image/profile_card.svg" width="700" alt="Profile Card"/>
    <div class="note">
      Effects: Typewriter reveal · Info fade-in · Light shimmer (5s) · Breathing pulse (6s)
    </div>
  </div>

  <div class="card">
    <div class="label">Portrait only (ultra-HD)</div>
    <img src="./image/ascii_portrait.svg" width="600" alt="HD ASCII Portrait"/>
  </div>

  <div class="card">
    <div class="label">Refresh the page to replay the typewriter reveal animation</div>
  </div>
</body>
</html>
