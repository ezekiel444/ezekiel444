<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASCII Portrait Preview</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0D1117;
      font-family: system-ui, sans-serif;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      color: #E8DCC8;
      font-weight: 300;
      margin-bottom: 1rem;
      font-size: 1.2rem;
    }
    p {
      color: #5B7D99;
      font-size: 0.85rem;
      margin-top: 1rem;
    }
    img {
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(74, 107, 138, 0.15);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ASCII Portrait — Animation Preview</h1>
    <img src="./image/ascii_portrait.svg" width="600" alt="Animated ASCII Portrait"/>
    <p>Open this file in your browser to see the effects:<br/>
    Typewriter reveal · Light shimmer · Breathing pulse · CRT scanlines</p>
  </div>
</body>
</html>
